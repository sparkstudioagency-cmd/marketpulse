name: Tshwane collection and guarded import

on:
  workflow_dispatch:
  schedule:
    # UTC: 13:23 and 18:23 SAST. Publication dates always come from the source.
    - cron: '23 11 * * *'
    - cron: '23 16 * * *'

permissions:
  contents: read

concurrency:
  group: tshwane-market-collection
  cancel-in-progress: false

jobs:
  archive-source:
    name: Collect, validate, archive and import accepted publication
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout reviewed collection release
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test archive import guards
        run: npx playwright test tests/archive-import-bridge.spec.ts tests/johannesburg-reviewed-mappings.spec.ts tests/supabase-importer.spec.ts --project=chromium --reporter=line
      - name: Preserve the current public source publication
        run: npx tsx scripts/collect-tshwane-only.ts --collect-public --timeout-ms=9000000 --output-root=scraper-diagnostics/collection-only
      - name: Validate Tshwane import bridge (dry run)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/tshwane-archive-import.ts
      - name: Import accepted Tshwane publication into production
        if: ${{ vars.MARKETPULSE_ENABLE_TSHWANE_IMPORT == 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MARKETPULSE_ENABLE_TSHWANE_IMPORT: 'true'
        run: npx tsx scripts/tshwane-archive-import.ts --commit
      - name: Upload source evidence even if validation fails
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tshwane-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: scraper-diagnostics/collection-only/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
